<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10th Quiz Pro - Updated Edition</title>
    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #fbbf24; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; padding-bottom: 60px; }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 100; }
        .hidden { display: none !important; }
        
        /* Network Error Screen */
        #net-error-screen { z-index: 10001; background: #000; text-align: center; }
        
        .card { background: var(--card); padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 450px; border: 1px solid #334155; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-weight: bold; color: white; }
        .btn-mode { background: linear-gradient(135deg, #6366f1, #a855f7); margin-bottom: 15px; }
        .btn-sub { background: #2563eb; text-align: left; padding-left: 20px; }
        
        /* Timer & Progress */
        #timer-container { position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: #334155; }
        #timer-bar { height: 100%; background: var(--accent); width: 100%; transition: linear 1s; }
        
        .option-btn { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #475569; border-radius: 12px; background: #1e293b; color: white; text-align: left; }
        .correct { background: #059669 !important; border-color: #10b981 !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
        
        /* Native Ad Container */
        #native-ad-box { width: 90%; background: #1e293b; margin-top: 15px; border-radius: 10px; min-height: 50px; border: 1px dashed #475569; font-size: 10px; color: #475569; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="net-error-screen" class="screen hidden">
        <div class="card">
            <h1 style="color:#ef4444;">📶 नेटवर्क बंद है!</h1>
            <p>अभिषेक, ऐप लोड करने के लिए इंटरनेट चालू करें।</p>
            <button class="btn" style="background:#2563eb" onclick="location.reload()">फिर से कोशिश करें</button>
        </div>
    </div>

    <div id="main-home-screen" class="screen">
        <div class="card">
            <h1 style="color:var(--accent);">10th Quiz Pro</h1>
            <p>क्या करना चाहेंगे?</p>
            <button class="btn btn-mode" onclick="openSection('Notes')">📚 नोट्स (Notes)</button>
            <button class="btn btn-mode" style="background: linear-gradient(135deg, #10b981, #3b82f6);" onclick="openSection('Quiz')">🎮 क्विज (Quiz)</button>
            <div id="native-ad-box">ADVERTISEMENT</div>
        </div>
    </div>

    <div id="lang-screen" class="screen hidden">
        <div class="card">
            <h2>माध्यम चुनें</h2>
            <button class="btn" style="background:#f97316" onclick="initApp('hi')">हिंदी माध्यम</button>
            <button class="btn" style="background:#059669" onclick="initApp('en')">English Medium</button>
        </div>
    </div>

    <div id="sub-screen" class="screen hidden">
        <div class="card">
            <h2 id="sub-title">विषय चुनें</h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn btn-sub" onclick="startAction('Science')">🧪 विज्ञान</button>
                <button class="btn btn-sub" onclick="startAction('Mathematics')">📐 गणित</button>
                <button class="btn btn-sub" onclick="startAction('Social Science')">🌍 सा. वि.</button>
                <button class="btn btn-sub" onclick="startAction('Hindi')">📖 हिंदी</button>
                <button class="btn btn-sub" onclick="startAction('English')">🔤 English</button>
                <button class="btn btn-sub" onclick="startAction('Sanskrit')">🕉️ संस्कृत</button>
            </div>
            <button onclick="location.reload()" style="margin-top:20px; background:none; border:none; color:gray;">⬅️ पीछे जाएं</button>
        </div>
    </div>

<script>
    // --- चारों AD UNIT IDs ---
    const BANNER_ID = 'ca-app-pub-3294666124278706/2113872107';
    const INTERSTITIAL_ID = 'ca-app-pub-3294666124278706/3782176991';
    const NATIVE_AD_ID = 'ca-app-pub-3294666124278706/1378474541';
    const APP_OPEN_ID = 'ca-app-pub-3294666124278706/8682249495';

    let currentMode = ''; 
    const AdMob = window.Capacitor?.Plugins?.AdMob;

    // विज्ञापन शुरू करें
    async function initAds() {
        if (AdMob) {
            await AdMob.initialize();
            await AdMob.showBanner({ adId: BANNER_ID, position: 'BOTTOM_CENTER' });
            await AdMob.prepareInterstitial({ adId: INTERSTITIAL_ID });
        }
    }

    // नेटवर्क चेक
    function checkNet() {
        if (!navigator.onLine) {
            document.getElementById('net-error-screen').classList.remove('hidden');
        }
    }

    window.onload = () => {
        checkNet();
        initAds();
    };

    function openSection(mode) {
        currentMode = mode;
        document.getElementById('main-home-screen').classList.add('hidden');
        document.getElementById('lang-screen').classList.remove('hidden');
    }

    function initApp(l) {
        lang = l;
        document.getElementById('lang-screen').classList.add('hidden');
        document.getElementById('sub-screen').classList.remove('hidden');
        document.getElementById('sub-title').innerText = (currentMode === 'Notes' ? 'नोट्स के लिए विषय' : 'क्विज के लिए विषय');
    }

    function startAction(sub) {
        if (currentMode === 'Notes') {
            alert(sub + " के नोट्स स्कैन हो रहे हैं...");
            // यहाँ notes_10th.json को स्कैन करने का कोड डालें
        } else {
            // Quiz Start Logic यहाँ आएगा
        }
    }
</script>
</body>
</html>
