<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10th Quiz Pro - Final Update</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-3294666124278706" crossorigin="anonymous"></script>

    <style>
        :root { --bg: #050a18; --glass: rgba(255, 255, 255, 0.05); --accent: #ffd700; --primary: #00d2ff; --text: #ffffff; --correct: #00ff88; --wrong: #ff4b2b; --card-bg: #111827; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Network Screen */
        #net-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 100; padding: 20px; transition: 0.3s; }
        .hidden { display: none !important; }

        /* Buttons & Design */
        .card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { display: block; width: 100%; padding: 16px; margin: 12px 0; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-notes { background: linear-gradient(45deg, #1e3a8a, #3b82f6); }
        .btn-quiz { background: linear-gradient(45deg, #5b21b6, #8b5cf6); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .sub-btn { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; color: white; font-weight: 600; cursor: pointer; }

        /* Notes & Quiz Layout */
        #content-area { width: 100%; max-width: 600px; margin-top: 80px; padding-bottom: 80px; overflow-y: auto; text-align: left; scroll-behavior: smooth; }
        .note-box { background: var(--glass); padding: 18px; margin-bottom: 15px; border-radius: 18px; border-left: 6px solid var(--primary); }
        
        .option-btn { width: 100%; padding: 16px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; text-align: left; cursor: pointer; font-size: 1rem; }
        .correct { background: var(--correct) !important; color: #000 !important; font-weight: bold; border-color: transparent; }
        .wrong { background: var(--wrong) !important; color: #fff !important; border-color: transparent; }

        /* Timer & Navigation */
        #timer-bar { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: var(--accent); z-index: 1000; box-shadow: 0 0 10px var(--accent); }
        .back-nav { position: fixed; top: 15px; left: 15px; z-index: 1001; background: #1f2937; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 18px; border-radius: 10px; cursor: pointer; }
        
        /* Report Card Styling */
        .report-card { background: white; color: #1a1a1a; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; margin: 50px auto; text-align: center; border: 8px double #eee; }
        .report-header { border-bottom: 2px dashed #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 1.1rem; }
        .grade { font-size: 3rem; font-weight: 900; color: #3b82f6; margin: 15px 0; }

        .ad-banner { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #555; z-index: 999; }
    </style>
</head>
<body>

    <div id="net-screen" class="hidden">
        <div class="card"><h1>📶</h1><h2>नेटवर्क कनेक्शन नहीं है</h2><p>कृपया इंटरनेट चालू करें</p></div>
    </div>

    <div id="home-screen" class="screen">
        <div class="card">
            <h1 style="background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem; margin-bottom: 10px;">10th Quiz Pro</h1>
            <p style="color: #94a3b8; margin-bottom: 25px;">तैयारी जीत की!</p>
            <button class="btn btn-notes" onclick="setMode('Notes')">📚 नोट्स (Study Notes)</button>
            <button class="btn btn-quiz" onclick="setMode('Quiz')">✍️ क्विज (Start Quiz)</button>
        </div>
    </div>

    <div id="sub-screen" class="screen hidden">
        <div class="card">
            <h2 style="color: var(--accent);">विषय चुनें</h2>
            <div class="grid">
                <button class="sub-btn" onclick="start('Hindi')">Hindi</button>
                <button class="sub-btn" onclick="start('Science')">Science</button>
                <button class="sub-btn" onclick="start('Mathematics')">Maths</button>
                <button class="sub-btn" onclick="start('English')">English</button>
                <button class="sub-btn" onclick="start('Sanskrit')">Sanskrit</button>
                <button class="sub-btn" onclick="start('Social Science')">Social Sci</button>
            </div>
            <button onclick="location.reload()" style="margin-top:20px; background:none; border:none; color:gray; cursor:pointer;">⬅ Back Home</button>
        </div>
    </div>

    <div id="view-screen" class="screen hidden" style="justify-content: flex-start; overflow-y: auto;">
        <div id="timer-bar" class="hidden"></div>
        <button class="back-nav" onclick="location.reload()">🏠 Home</button>
        <div id="content-area"></div>
    </div>

    <div class="ad-banner">Banner Ad ID: 2113872107</div>

<script>
    // IDs from your screenshots
    const ADS = {
        banner: "ca-app-pub-3294666124278706/2113872107",
        interstitial: "ca-app-pub-3294666124278706/3782176991"
    };

    function checkNet() {
        const netDiv = document.getElementById('net-screen');
        !navigator.onLine ? netDiv.classList.remove('hidden') : netDiv.classList.add('hidden');
    }
    window.addEventListener('online', checkNet);
    window.addEventListener('offline', checkNet);

    let mode = '', quizData = [], qIdx = 0, score = 0, selectedSubject = '';

    function setMode(m) {
        mode = m;
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('sub-screen').classList.remove('hidden');
    }

    async function start(sub) {
        selectedSubject = sub;
        document.getElementById('sub-screen').classList.add('hidden');
        document.getElementById('view-screen').classList.remove('hidden');
        const area = document.getElementById('content-area');
        area.innerHTML = "<center style='margin-top:50px;'>लोड हो रहा है... 🚀</center>";

        const fileName = (mode === 'Notes') ? 'master_notes_10th.json' : 'questions.json';
        
        try {
            const res = await fetch(fileName);
            const json = await res.json();
            
            if (mode === 'Notes') {
                const subData = Array.isArray(json) ? json.find(d => d.subject === sub) : (json.subject === sub ? json : null);
                if (!subData) throw "Empty";
                area.innerHTML = `<h2 style='text-align:center; color:var(--accent); margin-bottom:20px;'>${sub} Notes</h2>`;
                subData.data.forEach(n => {
                    area.innerHTML += `
                        <div class="note-box">
                            <b style="color:var(--primary);">प्रश्न: ${n.question}</b><br>
                            <p style="margin-top:10px; color:#cbd5e1;">${n.answer.replace(/\\n/g, '<br>')}</p>
                        </div>`;
                });
            } else {
                quizData = json.filter(q => q.subject === sub).sort(() => 0.5 - Math.random()).slice(0, 10);
                if (quizData.length === 0) throw "No Quiz";
                document.getElementById('timer-bar').classList.remove('hidden');
                loadQuiz();
            }
        } catch(e) { area.innerHTML = "<center style='margin-top:50px;'>डेटा नहीं मिला! ❌<br>कृपया JSON फाइल चेक करें।</center>"; }
    }

    function loadQuiz() {
        if (qIdx >= quizData.length) {
            showReportCard();
            return;
        }
        const q = quizData[qIdx];
        const area = document.getElementById('content-area');
        area.innerHTML = `
            <div style="padding:10px;">
                <p style="color:var(--accent); font-weight:bold;">Progress: ${qIdx+1}/${quizData.length}</p>
                <h3 style="font-size:1.3rem; margin:15px 0;">${q.question_hi || q.question_en}</h3>
                <div id="opts-box"></div>
            </div>`;
        
        q.options.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => {
                const btns = document.querySelectorAll('.option-btn');
                btns.forEach(btn => btn.style.pointerEvents = 'none');
                if (opt === q.answer) {
                    b.classList.add('correct');
                    score++;
                } else {
                    b.classList.add('wrong');
                    btns.forEach(btn => { if(btn.innerText === q.answer) btn.classList.add('correct'); });
                }
                setTimeout(() => { qIdx++; loadQuiz(); }, 1200);
            };
            document.getElementById('opts-box').appendChild(b);
        });

        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none'; bar.style.width = '100%';
        setTimeout(() => { bar.style.transition = 'linear 15s'; bar.style.width = '0%'; }, 100);
    }

    function showReportCard() {
        document.getElementById('timer-bar').classList.add('hidden');
        const percent = Math.round((score/quizData.length)*100);
        let grade = percent >= 80 ? 'A+' : percent >= 60 ? 'B' : percent >= 40 ? 'C' : 'D';
        let msg = percent >= 40 ? 'बधाई हो! आप पास हैं।' : 'थोड़ी और मेहनत करें!';

        document.getElementById('content-area').innerHTML = `
            <div class="report-card">
                <div class="report-header">
                    <h2 style="margin:0;">10th Quiz Pro</h2>
                    <p style="margin:5px 0; color:#666;">Official Progress Report</p>
                </div>
                <div class="stat-row"><span>विषय:</span><b>${selectedSubject}</b></div>
                <div class="stat-row"><span>कुल प्रश्न:</span><b>${quizData.length}</b></div>
                <div class="stat-row"><span>सही उत्तर:</span><b style="color:#10b981;">${score}</b></div>
                <div class="stat-row"><span>प्रतिशत:</span><b>${percent}%</b></div>
                <div class="grade">${grade}</div>
                <p style="font-weight:bold; color:#3b82f6;">${msg}</p>
                <button class="btn btn-notes" onclick="location.reload()" style="margin-top:20px;">Home पर वापस जाएं</button>
            </div>`;
    }

    window.onload = checkNet;
</script>
</body>
</html>
