<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10th Quiz Pro - Complete Edition</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-3294666124278706" crossorigin="anonymous"></script>

    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #fbbf24; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 60px; overflow-x: hidden; }
        
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 100; }
        .hidden { display: none !important; }
        
        /* Network Error */
        #net-error { z-index: 10001; background: #000; text-align: center; }
        
        /* Cards & Buttons */
        .card { background: var(--card); padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 450px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-mode { background: linear-gradient(135deg, #6366f1, #a855f7); }
        .btn-sub { background: #2563eb; text-align: left; padding-left: 20px; font-size: 0.9rem; }
        
        /* Subject Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 15px; }
        
        /* Timer Bar */
        #timer-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #334155; z-index: 200; }
        #timer-bar { height: 100%; background: var(--accent); width: 100%; transition: linear 1s; }

        /* Notes Display */
        #content-area { width: 95%; height: 75vh; overflow-y: auto; margin-top: 60px; padding: 10px; }
        .note-box { background: #1e293b; padding: 15px; margin-bottom: 12px; border-radius: 12px; border-left: 4px solid var(--accent); text-align: left; }
        
        /* Ads Bottom */
        .ad-banner { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #475569; }
    </style>
</head>
<body>

    <div id="net-error" class="screen hidden">
        <div class="card">
            <h1 style="color:#ef4444;">📶 नेटवर्क बंद है!</h1>
            <p>अभिषेक, ऐप लोड करने के लिए इंटरनेट चालू करें।</p>
            <button class="btn" style="background:#2563eb" onclick="location.reload()">फिर से कोशिश करें</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <div class="card">
            <h1 style="color:var(--accent);">10th Quiz Pro</h1>
            <button class="btn btn-mode" onclick="showLang('Notes')">📚 नोट्स पढ़ें (Notes)</button>
            <button class="btn btn-mode" style="background: linear-gradient(135deg, #10b981, #3b82f6);" onclick="showLang('Quiz')">🎮 क्विज खेलें (Quiz)</button>
        </div>
    </div>

    <div id="lang-screen" class="screen hidden">
        <div class="card">
            <h2>माध्यम चुनें</h2>
            <button class="btn" style="background:#f97316" onclick="showSubs('hi')">हिंदी माध्यम</button>
            <button class="btn" style="background:#059669" onclick="showSubs('en')">English Medium</button>
        </div>
    </div>

    <div id="sub-screen" class="screen hidden">
        <div class="card">
            <h2 id="sub-title">विषय चुनें</h2>
            <div class="grid">
                <button class="btn btn-sub" onclick="loadContent('Hindi')">📖 हिन्दी</button>
                <button class="btn btn-sub" onclick="loadContent('English')">🔤 English</button>
                <button class="btn btn-sub" onclick="loadContent('Science')">🧪 विज्ञान</button>
                <button class="btn btn-sub" onclick="loadContent('Mathematics')">📐 गणित</button>
                <button class="btn btn-sub" onclick="loadContent('Social Science')">🌍 सा. वि.</button>
                <button class="btn btn-sub" onclick="loadContent('Sanskrit')">🕉️ संस्कृत</button>
            </div>
            <button onclick="location.reload()" style="margin-top:20px; background:none; border:none; color:gray;">⬅️ वापस जाएं</button>
        </div>
    </div>

    <div id="view-screen" class="screen hidden" style="justify-content: flex-start;">
        <div id="timer-container" class="hidden"><div id="timer-bar"></div></div>
        <button onclick="location.reload()" style="position:fixed; top:15px; left:15px; background:rgba(255,255,255,0.1); border:none; color:white; padding:10px; border-radius:8px; z-index:300;">◀ Back</button>
        <div id="content-area"></div>
    </div>

    <div class="ad-banner">AD LOADING... (Banner ID: 2113872107)</div>

<script>
    // --- 4 AD UNITS CONFIG ---
    const AD_CONFIG = {
        app: "ca-app-pub-3294666124278706~1128093498",
        banner: "ca-app-pub-3294666124278706/2113872107",
        inter: "ca-app-pub-3294666124278706/3782176991",
        native: "ca-app-pub-3294666124278706/1378474541",
        open: "ca-app-pub-3294666124278706/8682249495"
    };

    let mode = '', lang = '';

    // नेटवर्क चेक
    function checkNet() {
        if (!navigator.onLine) document.getElementById('net-error').classList.remove('hidden');
    }
    window.onload = () => { checkNet(); initAds(); };

    // नेविगेशन
    function showLang(m) { mode = m; document.getElementById('home-screen').classList.add('hidden'); document.getElementById('lang-screen').classList.remove('hidden'); }
    function showSubs(l) { lang = l; document.getElementById('lang-screen').classList.add('hidden'); document.getElementById('sub-screen').classList.remove('hidden'); }

    // फाइल स्कैन और डेटा लोड लॉजिक
    async function loadContent(subject) {
        document.getElementById('sub-screen').classList.add('hidden');
        document.getElementById('view-screen').classList.remove('hidden');
        const area = document.getElementById('content-area');
        area.innerHTML = "<p>स्कैन हो रहा है...</p>";

        if (mode === 'Notes') {
            // notes_10th.json लोड करें
            try {
                const res = await fetch('notes_10th.json');
                const data = await res.json();
                // आपकी वीडियो वाली फाइल स्ट्रक्चर के हिसाब से रेंडरिंग
                area.innerHTML = `<h2>${subject} नोट्स</h2>`;
                data.data.forEach(item => {
                    const box = document.createElement('div');
                    box.className = 'note-box';
                    box.innerHTML = `<b>प्र. ${item.question}</b><br><span style="color:#94a3b8">उ. ${item.answer}</span>`;
                    area.appendChild(box);
                });
            } catch (e) { area.innerHTML = "notes_10th.json फाइल नहीं मिली!"; }
        } else {
            // questions.json लोड करें
            area.innerHTML = `<h2>${subject} क्विज शुरू हो रहा है...</h2>`;
            // यहाँ आपका क्विज इंजन कोड आएगा
        }
    }

    // AdMob Initialization (Capacitor)
    async function initAds() {
        const AdMob = window.Capacitor?.Plugins?.AdMob;
        if (AdMob) {
            await AdMob.initialize();
            await AdMob.showBanner({ adId: AD_CONFIG.banner, position: 'BOTTOM_CENTER' });
            await AdMob.prepareInterstitial({ adId: AD_CONFIG.inter });
        }
    }
</script>
</body>
</html>
